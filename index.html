<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Ryder Cup 2026 · Live Scoring</title>
<style>
  :root{
    --paper:#F1EAD9; --paper-dim:#e9e0c9; --ink:#182620; --ink-soft:#5a675e;
    --line:#cdbf9a; --green:#1F4D36; --green-deep:#123326;
    --row:#1D3557; --row-soft:#e7ecf3; --eur:#BD5B26; --eur-soft:#f7e8dd;
    --gold:#C79A3E; --card:#FBF8F0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; min-height:100vh; }
  .display{ font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif; }
  .tnum{ font-variant-numeric:tabular-nums; font-family:"SF Mono","Roboto Mono",Menlo,Consolas,monospace; }
  #app{ max-width:480px; margin:0 auto; padding-bottom:40px; }

  header.top{ background:var(--green-deep); color:var(--paper); padding:16px 16px 12px; border-bottom:3px solid var(--gold); position:sticky; top:0; z-index:20; }
  header.top .crest-row{ display:flex; align-items:baseline; justify-content:space-between; }
  header.top h1{ font-size:18px; margin:0; letter-spacing:0.2px; font-weight:700; }
  header.top .sub{ font-size:11px; color:#cfe0d3; margin-top:2px; line-height:1.5; }
  .gear{ background:none;border:1px solid #3d5b4c;color:#cfe0d3;border-radius:8px;padding:5px 9px;font-size:12px; }

  nav.tabs{ display:flex; background:var(--paper-dim); position:sticky; top:110px; z-index:19; border-bottom:1px solid var(--line); overflow-x:auto; }
  nav.tabs button{ flex:1; border:none; background:none; padding:10px 3px; font-size:11.5px; font-weight:600; color:var(--ink-soft); border-bottom:3px solid transparent; white-space:nowrap; }
  nav.tabs button.active{ color:var(--green-deep); border-bottom-color:var(--green); }

  .panel{ padding:14px 12px 4px; }
  .section-title{ font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin:14px 4px 4px; display:flex; justify-content:space-between; align-items:center; }
  .nine-pill{ font-size:10px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:3px 9px; text-transform:none; letter-spacing:0; }

  .match-card{ background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:10px; overflow:hidden; }
  .match-head{ display:flex; align-items:center; gap:8px; padding:10px 12px; cursor:pointer; }
  .match-num{ width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff; font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0; }
  .match-names{ flex:1; min-width:0; }
  .name-input{ font-size:13px; font-weight:600; border:none; background:transparent; width:100%; padding:1px 0; border-bottom:1px dashed transparent; }
  .name-input:focus{ outline:none; border-bottom:1px dashed var(--ink-soft); }
  .name-input.row{ color:var(--row); }
  .name-input.eur{ color:var(--eur); }
  .name-input::placeholder{ color:#b9ad8c; font-weight:400; }
  .name-row{ display:flex; align-items:center; gap:4px; }
  .hcp-input{ width:34px; font-size:10.5px; color:var(--ink-soft); border:none; background:transparent; text-align:right; border-bottom:1px dashed transparent; }
  .hcp-input:focus{ outline:none; border-bottom:1px dashed var(--ink-soft); }
  .hcp-input::placeholder{ color:#c9bd9c; }
  .vs-mini{ font-size:9px; color:var(--ink-soft); margin:0; }
  .status-chip{ font-size:10px; font-weight:700; padding:5px 7px; border-radius:20px; white-space:nowrap; background:#e3e0d3; color:var(--ink-soft); flex-shrink:0; }
  .status-chip.row{ background:var(--row-soft); color:var(--row); }
  .status-chip.eur{ background:var(--eur-soft); color:var(--eur); }
  .status-chip.final{ background:var(--green); color:#fff; }
  .caret{ color:var(--ink-soft); font-size:11px; transition:transform .15s; flex-shrink:0; }
  .match-card.open .caret{ transform:rotate(180deg); }

  .match-body{ display:none; border-top:1px solid var(--line); padding:10px 10px 14px; background:#fffdf7; }
  .match-card.open .match-body{ display:block; }

  .strokes-note{ font-size:11px; color:var(--ink-soft); margin-bottom:8px; display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .strokes-note input{ width:32px; text-align:center; border:1px solid var(--line); border-radius:5px; font-size:11px; height:22px; }
  table.grid{ border-collapse:collapse; width:100%; }
  table.grid th, table.grid td{ padding:2px; text-align:center; }
  table.grid th{ font-size:10px; color:var(--ink-soft); font-weight:600; }
  table.grid td.rowlabel{ text-align:left; font-size:10.5px; font-weight:600; width:60px; padding-right:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:60px; }
  table.grid td.rowlabel.row{ color:var(--row); } table.grid td.rowlabel.eur{ color:var(--eur); }
  .cell-input{ width:100%; max-width:27px; height:27px; border:1px solid var(--line); border-radius:5px; text-align:center; font-size:12.5px; background:#fff; padding:0; }
  .cell-input:focus{ outline:2px solid var(--green); border-color:var(--green); }
  td.strokehint{ position:relative; }
  .dot{ position:absolute; top:1px; right:6px; width:4px;height:4px;border-radius:50%;background:var(--gold); }

  .live-status{ margin-top:10px; text-align:center; font-size:13px; font-weight:700; padding:8px; border-radius:8px; background:#eee6cf; }
  .live-status.row{ background:var(--row-soft); color:var(--row); }
  .live-status.eur{ background:var(--eur-soft); color:var(--eur); }
  .live-status.final{ background:var(--green); color:#fff; }

  .row-actions{ display:flex; justify-content:space-between; margin-top:8px; align-items:center; }
  .link-btn{ background:none;border:none;color:#9a3d3d;font-size:11px;text-decoration:underline;padding:4px; }
  .link-btn.muted{ color:var(--ink-soft); }

  .add-match-btn{ width:100%; padding:12px; border:1.5px dashed var(--line); background:none; border-radius:10px; color:var(--ink-soft); font-size:13px; font-weight:600; margin:6px 0 16px; }
  .empty-note{ font-size:11.5px; color:var(--ink-soft); text-align:center; padding:16px 10px; }

  .lb-total{ display:flex; align-items:stretch; gap:8px; margin-bottom:14px; }
  .lb-box{ flex:1; border-radius:10px; padding:14px 6px; text-align:center; }
  .lb-box.row{ background:var(--row); color:#fff; } .lb-box.eur{ background:var(--eur); color:#fff; }
  .lb-box .pts{ font-size:28px; font-weight:800; font-family:Georgia,serif; }
  .lb-box .lbl{ font-size:10.5px; opacity:.9; margin-top:2px; }
  .lb-mid{ display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; color:var(--ink-soft); width:40px; }
  .bar{ height:10px; border-radius:6px; background:var(--line); overflow:hidden; display:flex; margin-bottom:14px; }
  .bar .fill-row{ background:var(--row); } .bar .fill-eur{ background:var(--eur); }
  .lb-format{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  .lb-format h3{ margin:0 0 8px; font-size:13px; font-family:Georgia,serif; }
  .lb-line{ display:flex; justify-content:space-between; font-size:12px; padding:4px 0; border-bottom:1px dashed var(--line); gap:8px; }
  .lb-line:last-child{ border-bottom:none; }
  .lb-line span:first-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-line .pt{ font-weight:700; width:38px; text-align:center; flex-shrink:0; }
  .lb-line .pt.row{ color:var(--row); } .lb-line .pt.eur{ color:var(--eur); }

  .setup-panel{ padding:14px 12px; }
  .setup-panel p{ font-size:12px; color:var(--ink-soft); line-height:1.5; }
  .setup-block{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:14px; }
  .setup-block h3{ margin:0 0 8px; font-size:13px; font-family:Georgia,serif; }
  .field-row{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .field-row label{ font-size:11.5px; color:var(--ink-soft); width:90px; flex-shrink:0; }
  .field-row input, .field-row select{ flex:1; height:32px; border:1px solid var(--line); border-radius:6px; padding:0 8px; font-size:13px; }
  .si-grid{ display:grid; grid-template-columns:repeat(9,1fr); gap:5px; margin:10px 0; }
  .si-cell{ text-align:center; }
  .si-cell label{ font-size:9.5px; color:var(--ink-soft); display:block; margin-bottom:3px; }
  .si-cell input{ width:100%; height:30px; text-align:center; border:1px solid var(--line); border-radius:6px; font-size:12.5px; }
  .primary-btn{ background:var(--green); color:#fff; border:none; border-radius:8px; padding:10px 16px; font-size:13px; font-weight:700; width:100%; margin-top:4px; }
  .ghost-btn{ background:none; border:1px solid var(--line); color:var(--ink-soft); border-radius:8px; padding:8px 14px; font-size:12px; margin-top:8px; width:100%; }

  .schedule-item{ display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .schedule-item .time{ font-weight:700; font-size:12.5px; width:78px; flex-shrink:0; font-family:Georgia,serif; }
  .schedule-item .desc strong{ display:block; font-size:13px; }
  .schedule-item .desc span{ font-size:11.5px; color:var(--ink-soft); }

  .cd-bar{ background:var(--green); color:var(--paper); border-bottom:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center; gap:7px; padding:7px 10px;
    font-size:12px; position:sticky; top:74px; z-index:18; }
  .cd-bar .cd-t{ font-variant-numeric:tabular-nums; font-weight:800; font-family:Georgia,serif; font-size:14px; letter-spacing:.3px; }
  .cd-bar .cd-s{ font-size:10.5px; color:#cfe0d3; text-transform:uppercase; letter-spacing:.07em; }
  .countdown{ background:var(--green-deep); color:var(--paper); border-radius:12px; padding:16px 12px; text-align:center; margin-bottom:14px; border:1px solid var(--gold); }
  .countdown .cd-label{ font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:#cfe0d3; }
  .cd-units{ display:flex; justify-content:center; gap:6px; margin-top:9px; }
  .cd-unit{ background:rgba(255,255,255,.07); border-radius:8px; padding:8px 0; flex:1; max-width:74px; }
  .cd-num{ font-size:23px; font-weight:800; font-family:Georgia,serif; line-height:1; font-variant-numeric:tabular-nums; }
  .cd-word{ font-size:9.5px; color:#b9cfc0; margin-top:3px; letter-spacing:.05em; }
  .cd-live{ font-size:17px; font-weight:800; font-family:Georgia,serif; padding:4px 0; }
  .cd-mini{ font-size:10.5px; color:#cfe0d3; margin-top:3px; }
  .av{ width:36px; height:36px; border-radius:50%; display:block; object-fit:cover; border:1.5px solid var(--line); background:#e9e2cf; }
  .av-fallback{ display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff; }
  .av-fallback.a{ background:var(--row); } .av-fallback.b{ background:var(--eur); }
  .ov-av{ width:40px; }
  .ov-table{ width:100%; border-collapse:collapse; }
  .ov-table td{ padding:7px 4px; border-bottom:1px solid var(--line); font-size:11.5px; vertical-align:middle; }
  .ov-table tr:last-child td{ border-bottom:none; }
  .ov-num{ width:20px; height:20px; border-radius:50%; background:var(--green); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .ov-a{ color:var(--row); font-weight:600; text-align:right; }
  .ov-b{ color:var(--eur); font-weight:600; }
  .ov-h{ color:var(--ink-soft); font-size:10.5px; width:30px; text-align:center; font-variant-numeric:tabular-nums; }
  .ov-head{ display:flex; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); justify-content:space-between; padding:0 4px 6px; }
  .photo-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .photo-tile{ position:relative; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:var(--card); }
  .photo-tile img{ width:100%; height:150px; object-fit:cover; display:block; }
  .photo-cap{ font-size:10.5px; padding:5px 7px; color:var(--ink-soft); }
  .photo-del{ position:absolute; top:5px; right:5px; background:rgba(0,0,0,.55); color:#fff; border:none; border-radius:6px; font-size:11px; padding:3px 7px; }
  .upload-box{ border:1.5px dashed var(--line); border-radius:10px; padding:18px 12px; text-align:center; margin-bottom:14px; background:var(--card); }
  .upload-box label{ display:inline-block; background:var(--green); color:#fff; border-radius:8px; padding:10px 18px; font-size:13px; font-weight:700; }
  .upload-box input[type=file]{ display:none; }
  .upload-note{ font-size:11px; color:var(--ink-soft); margin-top:8px; }
  .start-row{ font-size:11px; color:var(--ink-soft); margin-bottom:8px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .start-row select{ border:1px solid var(--line); border-radius:6px; height:26px; font-size:11.5px; background:#fff; padding:0 4px; }
  .muted-mini{ font-size:10px; color:#8a8878; }
  .warn-banner{ background:#fdf0d5; border:1px solid var(--gold); color:#7a5a12; border-radius:8px; padding:9px 11px; font-size:11.5px; margin-bottom:10px; }
  .si-bad{ border-color:#c0562e !important; background:#fdeee8; }
  .si-ok-note{ font-size:11px; color:#2b6b47; margin-top:4px; }
  .stroke-holes{ font-size:10.5px; color:var(--ink-soft); margin-top:5px; }
  .loading{ text-align:center; padding:50px 20px; color:var(--ink-soft); font-size:13px; }
  .loading img{ width:150px; margin-bottom:18px; opacity:.95; }
  header.top .crest-row{ gap:10px; }
  .crest-logo{ width:46px; height:auto; flex-shrink:0; filter:drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .head-left{ display:flex; align-items:center; gap:11px; min-width:0; }
  .lb-hero{ text-align:center; padding:2px 0 14px; }
  .lb-hero img{ width:132px; height:auto; }
  .info-hero{ text-align:center; padding:6px 0 14px; }
  .info-hero img{ width:170px; height:auto; }
</style>
</head>

    const read=p=>{ try{ const v=localStorage.getItem(K+p); return v?JSON.parse(v):null; }catch(e){ return null; } };
    const write=(p,d)=>{ localStorage.setItem(K+p, JSON.stringify(d)); notify(); };
    const del=p=>{ localStorage.removeItem(K+p); notify(); };
    const keys=pre=>{ const o=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.indexOf(K+pre)===0) o.push(k.slice(K.length)); } return o; };
    function notify(){ subs.forEach(f=>{ try{ f(); }catch(e){} }); }
    window.addEventListener('storage', notify);
    const snap=p=>{ const d=read(p); return {id:p.split('/').pop(), exists:!!d, data:()=>d}; };
    const docRef=p=>({
      async get(){ return snap(p); },
      async set(d){ write(p,d); },
      async delete(){ del(p); },
      onSnapshot(next){ const f=()=>next(snap(p)); subs.push(f); setTimeout(f,0); return ()=>{}; }
    });
    const colRef=p=>{
      const qs=()=>({docs:keys(p+'/').map(k=>snap(k))});
      return { doc:docRef, async get(){ return qs(); },
        onSnapshot(next){ const f=()=>next(qs()); subs.push(f); setTimeout(f,0); return ()=>{}; } };
    };
    return { doc:docRef, collection:colRef };
  }

  // A match starting elsewhere plays them in a rotated order.
  function playOrder(startHole){
    const st = Math.min(9, Math.max(1, +startHole || 1));
    const o = [];
    for(let k=0;k<9;k++){ o.push((st-1+k) % 9); }
    return o;
  }
  // Real course hole number for a position in the nine
  function courseHole(i, nine){ return nine==='back' ? i+10 : i+1; }

  function defFourball(p){ const d = p ? JSON.parse(JSON.stringify(p)) : {row:[{n:'',hcp:null,s:0},{n:'',hcp:null,s:0}], eur:[{n:'',hcp:null,s:0},{n:'',hcp:null,s:0}]}; if(d.startHole==null) d.startHole=1; return d; }

  function scrambleStrokes(d){

  function strokesPerHole(N, rank){
    const idx = rank.map((r,i)=>[r,i]).sort((a,b)=> a[0]-b[0] || a[1]-b[1]).map(p=>p[1]);
    const base = Math.floor(N/9), extra = N % 9;
    const out = Array(9).fill(base);
    for(let i=0;i<extra;i++){ out[idx[i]] += 1; }
    return out;
  }
  function netArray(gross, strokesGiven, rank){
    const spH = strokesPerHole(strokesGiven, rank);
    return gross.map((g,i)=> g==null ? null : g - spH[i]);
  }
  function bestBallNet(netA, netB){
    return netA.map((a,i)=>{ const b = netB[i]; if(a==null && b==null) return null; if(a==null) return b; if(b==null) return a; return Math.min(a,b); });
  }
  function matchStatus(netRow, netEur, order){
    const seq = order || HOLES.map((_,i)=>i);
    let rowWins=0, eurWins=0, played=0, decided=false, decidedAt=0;
    for(const i of seq){
      if(netRow[i]==null || netEur[i]==null) break;
      played++;
      if(netRow[i] < netEur[i]) rowWins++; else if(netEur[i] < netRow[i]) eurWins++;
      const remaining = 9 - played;
      if(!decided && remaining > 0 && Math.abs(rowWins-eurWins) > remaining){ decided = true; decidedAt = played; }
      if(decided) break;
    }
    const diff = rowWins - eurWins;
    if(played===0) return {label:'Not started', cls:'', text:'Awaiting scores'};
    if(decided){
      const remaining = 9 - decidedAt;
      const rowLead = diff>0;
      return {label:`${rowLead?'ROW':'EUR'} ${Math.abs(diff)}&${remaining}`, cls:'final', text:`${rowLead?meta.teamRow:meta.teamEur} win ${Math.abs(diff)}&${remaining}`, rowLead, tie:false};
    }
    if(played===9){
      if(diff===0) return {label:'HALVED', cls:'final', text:'Match halved', tie:true};
      const rowLead = diff>0;
      return {label:`${rowLead?'ROW':'EUR'} 1UP`, cls:'final', text:`${rowLead?meta.teamRow:meta.teamEur} win 1 up`, rowLead, tie:false};
    }
    if(diff===0) return {label:`AS thru ${played}`, cls:'', text:`All square thru ${played}`};
    const rowLead = diff>0;
    return {label:`${rowLead?'ROW':'EUR'} ${Math.abs(diff)}UP · ${played}`, cls:rowLead?'row':'eur', text:`${rowLead?'ROW':'EUR'} ${Math.abs(diff)} up thru ${played}`};
  }
  function points(status){
    if(status.cls!=='final') return null;
    if(status.tie) return {row:0.5, eur:0.5};
    return status.rowLead ? {row:1,eur:0} : {row:0,eur:1};
  }

  function rankFor(nine){ return nine==='back' ? siBack : siFront; }

  // Each nine must be ranked 1-9 with no repeats for strokes to land correctly
  function siValid(arr){
    const sorted = arr.slice().map(Number).sort((a,b)=>a-b);
    return sorted.length===9 && sorted.every((v,i)=>v===i+1);
  }
  function siWarning(){
    const bad = [];
    if(!siValid(siFront)) bad.push('front 9');
    if(!siValid(siBack)) bad.push('back 9');
    if(bad.length) return `Stroke index for the ${bad.join(' and ')} isn't a full 1-9 ranking \u2014 fix it under \u2699 or strokes will land on the wrong holes.`;
    if(!meta.siConfirmed) return `Stroke index is still the placeholder 1-9 order. Set the real Beroun ranking under \u2699 so handicap strokes land on the right holes.`;
    return '';
  }
  // Which holes a given number of strokes falls on, as course hole numbers
  function strokeHoles(n, nine){
    const sp = strokesPerHole(n, rankFor(nine));
    const out = [];
    sp.forEach((v,i)=>{ if(v>0) out.push(courseHole(i,nine) + (v>1?` (\u00d7${v})`:'')); });
    return out;
  }

  function singlesStatus(id){
    const d = defs.singles[id], sc = scores.singles[id], rank = rankFor(meta.singlesNine);
    return matchStatus(netArray(sc.row, d.rowStrokes, rank), netArray(sc.eur, d.eurStrokes, rank), playOrder(d.startHole));
  }
  function fourballStatus(id){
    const d = defs.fourball[id], sc = scores.fourball[id], rank = rankFor(meta.fourballNine);
    const r1=netArray(sc.row1,d.row[0].s,rank), r2=netArray(sc.row2,d.row[1].s,rank);
    const e1=netArray(sc.eur1,d.eur[0].s,rank), e2=netArray(sc.eur2,d.eur[1].s,rank);
    return matchStatus(bestBallNet(r1,r2), bestBallNet(e1,e2), playOrder(d.startHole));
  }
  function scrambleStatus(id){
    const d = defs.scramble[id], sc = scores.scramble[id], rank = rankFor(meta.scrambleNine);
    const st = scrambleStrokes(d);
    return matchStatus(netArray(sc.row, st.row, rank), netArray(sc.eur, st.eur, rank), playOrder(d.startHole));
  }

  function countdownParts(){
    const target = new Date(meta.teeOff || '2026-10-24T08:20:00').getTime();
    const diff = target - Date.now();
    if(isNaN(target)) return null;
    if(diff <= 0) return {past:true, diff};
    const sec = Math.floor(diff/1000);
    return { past:false,
      d: Math.floor(sec/86400),
      h: Math.floor(sec%86400/3600),
      m: Math.floor(sec%3600/60),
      s: sec%60 };
  }

  function countdownInner(){
    const c = countdownParts();
    if(!c) return '';
    if(c.past){
      const since = Math.abs(c.diff);
      return since < 12*3600*1000
        ? `<div class="cd-live">Tee off \u2014 play underway</div><div class="cd-mini">Good luck out there</div>`
        : `<div class="cd-live">Team Cup 2026 complete</div>`;
    }
    const u = [[c.d,'Days'],[c.h,'Hours'],[c.m,'Mins'],[c.s,'Secs']];
    return `<div class="cd-label">Countdown to tee off</div>
      <div class="cd-units">${u.map(x=>`<div class="cd-unit"><div class="cd-num">${String(x[0]).padStart(2,'0')}</div><div class="cd-word">${x[1]}</div></div>`).join('')}</div>
      <div class="cd-mini">Saturday 24 October 2026 \u00b7 08:20 first tee</div>`;
  }

  function countdownBarInner(){
    const c = countdownParts();
    if(!c) return '';
    if(c.past){
      const since = Math.abs(c.diff);
      return since < 12*3600*1000
        ? `<span class="cd-t">Play underway</span><span class="cd-s">24 Oct 2026</span>`
        : `<span class="cd-t">Team Cup complete</span>`;

  function photoFor(name){

    if(PLAYER_PHOTOS[name]) return PLAYER_PHOTOS[name];

  function initials(name){
    const parts = String(name||'').trim().split(/\s+/).filter(Boolean);
    if(!parts.length) return '?';
    return (parts[0][0] + (parts.length>1 ? parts[parts.length-1][0] : '')).toUpperCase();
  }
  function avatar(name, side){

      ? `<img class="av" src="${src}" alt="${esc(name)}">`

  function inputCell(type,id,field,i,val,strokeCount){

  function renderSinglesCard(id){
    const d = defs.singles[id], sc = scores.singles[id], status = singlesStatus(id);
    const rank = rankFor(meta.singlesNine);
    const spRow = strokesPerHole(d.rowStrokes, rank), spEur = strokesPerHole(d.eurStrokes, rank);
    const ord = playOrder(d.startHole);
    const key = `singles-${id}`, open = openKey===key;
    return `<div class="match-card ${open?'open':''}" data-key="${key}">
      <div class="match-head">
        <div class="match-num" data-toggle="${key}">${id}</div>
        <div class="match-names" data-toggle="${key}">

  function computeAllPoints(){
    let row=0, eur=0, decidedCount=0, total=0;
    const lines = {singles:[], fourball:[], scramble:[]};
    ids.singles.forEach(id=>{
      const st = singlesStatus(id), pts = points(st); total++;
      if(pts){ row+=pts.row; eur+=pts.eur; decidedCount++; }
      const d = defs.singles[id];
      lines.singles.push({label:`${(d.rowName||'TBC')} v ${(d.eurName||'TBC')}`, status:st, pts});
    });
    ids.fourball.forEach(id=>{
      const st = fourballStatus(id), pts = points(st); total++;
      if(pts){ row+=pts.row; eur+=pts.eur; decidedCount++; }
      lines.fourball.push({label:`Match ${id}`, status:st, pts});
    });
    ids.scramble.forEach(id=>{
      const st = scrambleStatus(id), pts = points(st); total++;
      if(pts){ row+=pts.row; eur+=pts.eur; decidedCount++; }
      lines.scramble.push({label:`Pairing ${id}`, status:st, pts});
    });
    return {row, eur, decidedCount, total, lines};
  }

  function renderLeaderboard(){
    const r = computeAllPoints();
    const denom = Math.max(r.total,1);
    const rowPct = r.row/denom*100, eurPct = r.eur/denom*100, restPct = 100-rowPct-eurPct;
    function fmtLine(l){
      const cls = l.pts ? (l.pts.row>l.pts.eur?'row':l.pts.eur>l.pts.row?'eur':'') : '';
      return `<div class="lb-line"><span>${esc(l.label)}</span><span class="pt ${cls}">${l.pts? (l.pts.row===l.pts.eur? '½–½' : l.pts.row>l.pts.eur?'1–0':'0–1') : '—'}</span></div>`;
    }
    const fbLines = r.lines.fourball.length ? r.lines.fourball.map(fmtLine).join('') : `<div class="empty-note">No fourball matches added yet</div>`;
    const scLines = r.lines.scramble.length ? r.lines.scramble.map(fmtLine).join('') : `<div class="empty-note">No scramble matches added yet</div>`;
    return `<div class="panel">
      <div class="lb-hero"><img src="${LOGO_HERO}" alt="Team Cup 2026"></div>
      <div class="lb-total">
        <div class="lb-box row"><div class="pts tnum">${r.row}</div><div class="lbl">${esc(meta.teamRow)}</div></div>
        <div class="lb-mid">of<br>${r.total}</div>
        <div class="lb-box eur"><div class="pts tnum">${r.eur}</div><div class="lbl">${esc(meta.teamEur)}</div></div>
      </div>
      <div class="bar"><div class="fill-row" style="width:${rowPct}%"></div><div class="fill-eur" style="width:${eurPct}%"></div><div style="width:${restPct}%"></div></div>
      <div class="empty-note" style="margin-bottom:14px;">${r.decidedCount} of ${r.total} matches decided</div>
      <div class="lb-format"><h3>Game 1 · Scramble</h3>${scLines}</div>
      <div class="lb-format"><h3>Game 2 · Fourball</h3>${fbLines}</div>
      <div class="lb-format"><h3>Game 3 · Singles</h3>${r.lines.singles.map(fmtLine).join('')}</div>
    </div>`;
  }

  function setByPath(obj, path, val){
    const parts = path.split('.');
    let o = obj;
    for(let i=0;i<parts.length-1;i++){ o = o[isNaN(parts[i])?parts[i]:+parts[i]]; }
    o[isNaN(parts[parts.length-1])?parts[parts.length-1]:+parts[parts.length-1]] = val;
  }

  function attachHandlers(){
    const gearBtn = document.getElementById('gear-btn');
    if(gearBtn) gearBtn.addEventListener('click', ()=>{ activeTab = activeTab==='setup' ? 'scramble' : 'setup'; render(); });
    document.querySelectorAll('nav.tabs button').forEach(b=> b.addEventListener('click', ()=>{ activeTab = b.dataset.tab; openKey=null; render(); }));
    document.querySelectorAll('[data-toggle]').forEach(el=> el.addEventListener('click', ()=>{ const k = el.dataset.toggle; openKey = openKey===k ? null : k; render(); }));

    document.querySelectorAll('.cell-input').forEach(inp=>{
      inp.addEventListener('input', (e)=>{ e.target.value = e.target.value.replace(/[^0-9]/g,'').slice(0,2); });
      inp.addEventListener('change', onScoreChange);
    });
    document.querySelectorAll('[data-def]').forEach(inp=> inp.addEventListener('change', onDefChange));
    document.querySelectorAll('[data-strokes]').forEach(inp=> inp.addEventListener('change', onStrokesChange));
    document.querySelectorAll('[data-meta]').forEach(inp=> inp.addEventListener('change', onMetaChange));
    document.querySelectorAll('[data-start]').forEach(sel=> sel.addEventListener('change', onStartChange));
    const photoInput = document.getElementById('photo-input');
    if(photoInput) photoInput.addEventListener('change', e=>{ handleFiles(Array.from(e.target.files||[])); });
    document.querySelectorAll('[data-delphoto]').forEach(b=> b.addEventListener('click', ()=> deletePhoto(b.dataset.delphoto)));
    document.querySelectorAll('[data-si]').forEach(inp=> inp.addEventListener('input', (e)=>{ e.target.value = e.target.value.replace(/[^0-9]/g,''); }));

    document.querySelectorAll('[data-clear]').forEach(btn=> btn.addEventListener('click', async ()=>{
      const [type,id] = btn.dataset.clear.split(':');
      if(!confirm('Clear all hole scores for this match?')) return;
      scores[type][id] = type==='singles'?defScoresSingles():type==='fourball'?defScoresFourball():defScoresScramble();
      await saveScore(type,id); render();
    }));
    document.querySelectorAll('[data-remove]').forEach(btn=> btn.addEventListener('click', async ()=>{
      const [type,id] = btn.dataset.remove.split(':');
      if(!confirm('Remove this match entirely?')) return;
      ids[type] = ids[type].filter(x=>String(x)!==String(id));
      await saveIds(type); await removeMatchDoc(type,id); openKey=null; render();
    }));
    document.querySelectorAll('[data-add]').forEach(btn=> btn.addEventListener('click', async ()=>{
      const type = btn.dataset.add;
      const id = nextId[type]++;
      defs[type][id] = type==='singles'?defSingles():type==='fourball'?defFourball():defScramble();
      scores[type][id] = type==='singles'?defScoresSingles():type==='fourball'?defScoresFourball():defScoresScramble();
      ids[type].push(id);
      await saveDef(type,id); await saveScore(type,id); await saveIds(type); await saveNextIds();
      openKey = `${type}-${id}`;
      render();
    }));

    const saveSetup = document.getElementById('save-setup');
    if(saveSetup) saveSetup.addEventListener('click', async ()=>{
      document.querySelectorAll('[data-si]').forEach(inp=>{
        const [which,i] = inp.dataset.si.split(':'); const v = +inp.value;
        if(v>0){ if(which==='front') siFront[+i]=v; else siBack[+i]=v; }
      });
      meta.siConfirmed = siValid(siFront) && siValid(siBack);
      await writeConfig();
      activeTab='scramble'; render();
    });
    const closeSetup = document.getElementById('close-setup');
    if(closeSetup) closeSetup.addEventListener('click', ()=>{ activeTab='scramble'; render(); });
  }

  async function onScoreChange(e){
    const el = e.target;
    const type = el.dataset.scType, id = el.dataset.scId, field = el.dataset.scField, i = +el.dataset.scI;
    const val = el.value === '' ? null : Math.max(1, Math.min(15, +el.value));
    scores[type][id][field][i] = val;
    await saveScore(type,id);
    render();
    const sel = `.cell-input[data-sc-type="${type}"][data-sc-id="${id}"][data-sc-field="${field}"][data-sc-i="${i}"]`;
    const again = document.querySelector(sel);
    if(again) again.focus();
  }
  async function onDefChange(e){
    const el = e.target;
    const [type,id,path] = (function(){ const s = el.dataset.def; const first = s.indexOf(':'), second = s.indexOf(':', first+1); return [s.slice(0,first), s.slice(first+1,second), s.slice(second+1)]; })();
    let val = el.value;
    if(path.endsWith('Hcp') && val!==''){ val = +val; } else if(path.endsWith('Hcp')){ val = null; }
    setByPath(defs[type][id], path, val);
    await saveDef(type,id);
  }
  async function onStrokesChange(e){
    const el = e.target;
    const s = el.dataset.strokes; const first = s.indexOf(':'), second = s.indexOf(':', first+1);
    const type = s.slice(0,first), id = s.slice(first+1,second), path = s.slice(second+1);
    const val = Math.max(0, Math.min(20, +el.value || 0));
    setByPath(defs[type][id], path, val);
    await saveDef(type,id);
    render();
  }
  // Photos are shrunk in the browser, then stored alongside the scores.
  function downscale(file, maxPx, quality){
    return new Promise((resolve, reject)=>{
      const fr = new FileReader();
      fr.onerror = ()=>reject(new Error('Could not read that file'));
      fr.onload = ()=>{
        const img = new Image();
        img.onerror = ()=>reject(new Error('That file is not an image'));
        img.onload = ()=>{
          let w = img.width, h = img.height;
          const scale = Math.min(1, maxPx / Math.max(w,h));
          w = Math.max(1, Math.round(w*scale)); h = Math.max(1, Math.round(h*scale));
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', quality));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  async function handleFiles(files){
    if(!db || !files || !files.length) return;
    uploading = files.length; render();
    for(const f of files){
      try{
        const url = await downscale(f, 1100, 0.6);
        if(url.length > 900000) throw new Error('Image too large after resizing');
        const id = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
        const rec = { id, url, name:f.name||'', ts:Date.now() };
        await db.doc('photos/'+id).set(rec);
        photos = [rec].concat(photos.filter(p=>p.id!==id));
      }catch(err){
        console.error('photo failed', err);
        const quota = err && /quota|exceeded/i.test(err.name+' '+err.message);
        alert(quota
          ? 'This device has run out of local storage for photos. Connect Firebase (see README) to store them properly.'
          : 'Could not add ' + (f.name||'that photo') + '.');
      }
      uploading = Math.max(0, uploading-1); render();
    }
    uploading = 0; render();
  }

  async function deletePhoto(pid){
    if(!confirm('Delete this photo?')) return;
    try{
      if(db) await db.doc('photos/'+pid).delete();
      photos = photos.filter(p=>p.id!==pid);
    }catch(e){ console.error('delete photo failed', e); }
    render();
  }

  function renderPhotos(){
    const tiles = photos.length ? `<div class="photo-grid">${photos.map(p=>`
        <div class="photo-tile">
          <img src="${esc(p.url)}" alt="${esc(p.name||'Photo')}" loading="lazy">
          <button class="photo-del" data-delphoto="${esc(p.id)}">Delete</button>
          <div class="photo-cap">${esc(new Date(p.ts||Date.now()).toLocaleString())}</div>
        </div>`).join('')}</div>`
      : `<div class="empty-note">No photos yet.</div>`;
    return `<div class="panel">
      <div class="section-title">Photos</div>
      ${syncMode==='local' ? `<div class="warn-banner">Not connected to Firebase, so photos stay on this device only. See README.md.</div>` : ''}
      <div class="upload-box">
        <label for="photo-input">${uploading? 'Adding\u2026' : 'Add photos'}</label>
        <input id="photo-input" type="file" accept="image/*" multiple>
        <div class="upload-note">${syncMode==='cloud' ? 'Shared with everyone using the scorecard' : 'Saved on this device only'}</div>
      </div>
      ${tiles}
    </div>`;
  }

  async function onStartChange(e){
    const [type,id] = e.target.dataset.start.split(':');
    defs[type][id].startHole = Math.min(9, Math.max(1, +e.target.value || 1));
    await saveDef(type,id);
    render();
  }
  async function onMetaChange(e){
    meta[e.target.dataset.meta] = e.target.value;
  }


  loadAll().then(render).catch(e=>{ console.error(e); ready=true; render(); });
})();
</script>
</body>
</html>
